*{margin:0;padding:0;box-sizing:border-box}

#outro svg{width:170px;height:170px;overflow:visible}
#outro .oT{margin-top:26px;font-family:var(--ffh),var(--ff),M,sans-serif;font-weight:800;font-size:92px;letter-spacing:-2.5px;line-height:1.05}

.hide{display:none!important}

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)], clamp = (v, a, b) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1), lerp = (a, b, p) => a + (b - a) * p;
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, out3 = p => 1 - Math.pow(1 - p, 3);
const back = p => { const c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[m]));
// текст подписи: короткие слова не остаются в конце строки, «50 €» не рвется, [Кнопка] выделена цветом как название на экране
const fmt = s => { let x = String(s == null ? '' : s);
  for (let k = 0; k < 2; k++) x = x.replace(/(^|[\s(])([\p{L}]{1,3})\s(?=[\p{L}\d\[€$])/gu, '$1$2 ');

  return esc(x).replace(/\[([^\]]+)\]/g, (_, u) => '<span class="ui">' + (u.length <= 24 ? u.replace(/ /g, '\u00a0') : u) + '</span>'); };
let M, L, IMG, cur = -1, STEPS = [], CHIPS = [];
function rise(el, t, a, d = .5, y = 30, blur = 8) { const p = out3(seg(t, a, a + d)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * y}px)`; el.style.filter = p < 1 ? `blur(${(1 - p) * blur}px)` : 'none'; return p; }
async function face(name, f) {  // шрифт бренда: файл (кавычки вокруг имени) или готовое значение font-family, например system-ui
  if (!f || !f.family) return null; if (!f.file) return f.family;
  const ff = new FontFace(f.family, `url("${f.file}")`, {weight: String(f.weight || '100 900')}); document.fonts.add(ff); await ff.load(); return `"${f.family}"`; }

function splitCap(el, raw) {
  const m = /^(.+?[,:])\s+(.+)$/.exec(raw); if (!m) return;
  const probe = document.createElement('span'); probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;letter-spacing:inherit'; el.appendChild(probe);
  const fits = s => { probe.innerHTML = fmt(s); return probe.offsetWidth <= el.clientWidth; };
  const ok = fits(m[1]) && fits(m[2]); probe.remove();

  { const SB = M.screen || {}, pt = sw / 393, sb = $('#sb'), hi = $('#hi');

      const tm = sb.querySelector('.tm'); tm.style.left = 0; tm.style.width = 0.36 * sw + 'px';

      const ic = sb.querySelector('.ic'); ic.style.right = 0; ic.style.width = 0.36 * sw + 'px';
      ic.querySelectorAll('svg').forEach((g, i) => { g.style.height = [11.5, 11.5, 12.5][i] * pt + 'px'; g.style.width = [17, 15.5, 27][i] * pt + 'px'; });
    } else sb.classList.add('hide');
    if (SB.bottom) { hi.style.width = 134 * pt + 'px'; hi.style.height = 5 * pt + 'px'; hi.style.bottom = 8 * pt + 'px'; hi.style.marginLeft = -67 * pt + 'px'; hi.style.setProperty('--hic', SB.bottomDark ? '#fff' : '#000'); }
    else hi.classList.add('hide'); }
  IMG = $('#f'); IMG.style.width = W + 'px'; IMG.style.height = H + 'px';
  const cap = $('#cap'); cap.style.top = capTop + 'px'; cap.style.height = capH + 'px';
  // тексты
  const logo = b.logo ? `<img src="${b.logo}">` : (b.logo_text ? `<b>${esc(b.logo_text)}</b>` : '');
  for (const [sel, on] of [['#hdr .brand', 1], ['#intro .ilogo', 1], ['#outro .ologo', 1]]) { $(sel).innerHTML = logo; $(sel).classList.toggle('hide', !logo); }
  $('#hdr .ht').textContent = M.title;
  $('#intro .kick').textContent = M.kicker;

function cam(t) {  // камера в пикселях записи: зум и центр, плавные переходы между ключами
  const K = M.keys; if (t <= K[0].t) return K[0]; if (t >= K[K.length - 1].t) return K[K.length - 1];

window.render = async t => {

  } else spot.style.opacity = 0;
  if (st.tap) {

    const [px, py, T, C] = st.tap, [X, Y] = map(px, py), a = seg(t, T - .2, T - .04), pr = seg(t, T - .02, T + .08), rl = seg(t, T + .08, T + .2);
    const gone = seg(t, Math.min(T + .1, C - .14), Math.min(T + .26, C - .02)), s = lerp(1.35, 1, out3(a)) * (1 - .18 * out3(pr) + .18 * out3(rl));

  } else { d.style.opacity = 0; r.style.opacity = 0; }
  // заставка: кадр 0 уже собран (его берут мессенджеры как превью), дальше мягкая доводка; потом блок уходит наверх, телефон встает на место
  { const I = $('#intro'); const out = io(seg(t, T0 - .9, T0 - .35)), st0 = out3(seg(t, 0, 1.3));
    $$('#intro .ln').forEach((l, i) => { const p = out3(seg(t, i * .08, .9 + i * .08)); l.style.transform = `translateY(${(1 - p) * 18}px)`; });

    rise($('#outro .ologo'), t, a, .5, 20, 6); rise($('#outro .oT'), t, a + .15, .5, 40, 10);

};
